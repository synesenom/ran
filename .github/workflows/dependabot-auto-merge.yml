name: Dependabot Auto-Merge

# Dependabot PRs are same-repo (not forked), so the default GITHUB_TOKEN can
# enable auto-merge directly via `gh pr merge --auto`. GitHub then merges the
# PR itself once all required status checks on the CI workflow pass — no
# polling needed here.
on:
  pull_request:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge for Dependabot PR
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
