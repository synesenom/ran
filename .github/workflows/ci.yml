name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-cache.outputs.cache-hit != 'true'
      - run: npm run lint

  jsdoclint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-cache.outputs.cache-hit != 'true'
      - run: npm run jsdoclint

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # nyc@18 (bumped for GHSA-w5hq-g745-h8pq, #960) declares engines.node "20 || >=22", excluding 18
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ matrix.node-version }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-cache.outputs.cache-hit != 'true'
      - run: npx cross-env NODE_ENV=test nyc --reporter=lcov ./node_modules/.bin/_mocha --require @babel/register
      - name: Upload coverage to Coveralls
        uses: coverallsapp/github-action@v2
        if: matrix.node-version == 20 && github.event_name == 'push'
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fail-on-error: false

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-cache.outputs.cache-hit != 'true'
      - run: npm run check-decl
      - run: ./node_modules/.bin/tsc -p tsconfig.build.json
      - run: npm run typecheck

  # Build-sanity check only — no deploy. Actual publishing (unreleased/ on
  # push to main, vX.Y.Z/ + root on release tags) is docs-deploy.yml, kept
  # separate so a plain PR build failure here still fails CI without needing
  # pages: write permissions on every PR run. See
  # decisions/0043-versioned-docs-deployment.md.
  docs-build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-cache.outputs.cache-hit != 'true'
      - run: npm run docs
      - run: test -f docs/index.html && test -f docs/guides.html && test -f docs/demo.html && test -f docs/styles/style.css

  build:
    needs: [lint, jsdoclint, test, typecheck]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        id: node-cache
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - run: npm ci
        if: steps.node-cache.outputs.cache-hit != 'true'
      - run: npm run build
      - run: test -f dist/ranjs.esm.js && test -f dist/ranjs.cjs.js && test -f dist/ranjs.min.js && test -f dist/index.d.ts
      - name: Check subpath build runtime behavior
        # A representative distribution/process/MCMC-sampler subpath build is actually imported
        # and run here — npm test never touches dist/, so a terser option change could otherwise
        # silently break or rename a minified subpath export without any test noticing (#1227).
        run: node scripts/check-subpath-runtime.js
      - name: Check bundle size budget
        # Budgets and rationale documented in README.md's "Bundle size budget" section.
        run: |
          RAW_BUDGET=358400
          GZIP_BUDGET=98304
          RAW_SIZE=$(wc -c < dist/ranjs.min.js)
          GZIP_SIZE=$(gzip -9 -c dist/ranjs.min.js | wc -c)
          echo "dist/ranjs.min.js: $RAW_SIZE bytes raw (budget: $RAW_BUDGET), $GZIP_SIZE bytes gzipped (budget: $GZIP_BUDGET)"
          FAILED=0
          if [ "$RAW_SIZE" -gt "$RAW_BUDGET" ]; then
            echo "ERROR: dist/ranjs.min.js grew to $RAW_SIZE raw bytes, exceeding the $RAW_BUDGET byte budget."
            FAILED=1
          fi
          if [ "$GZIP_SIZE" -gt "$GZIP_BUDGET" ]; then
            echo "ERROR: dist/ranjs.min.js grew to $GZIP_SIZE gzipped bytes, exceeding the $GZIP_BUDGET byte budget."
            FAILED=1
          fi
          if [ "$FAILED" -eq 1 ]; then
            echo "If the growth is intentional (e.g. a new distribution), raise the relevant budget in .github/workflows/ci.yml and update README.md's Bundle size budget section."
            echo "Otherwise, check for accidentally-broken tree-shaking (e.g. a helper imported unconditionally by every distribution)."
            exit 1
          fi
